<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FT Capture setup</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; background: #fff; color: #111; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: #555; font-size: 14px; }
  button { width: 100%; margin-top: 8px; padding: 14px; font-size: 16px; font-weight: 600;
           border: 0; border-radius: 6px; background: #d43900; color: #fff; }
  .msg { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
  .err { background: #fdecea; color: #8b1a10; }
  .info { background: #eef3fb; color: #1a3d6b; }
  code { font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Sign-in page for the watchapp. FacileThings v2 grants only authorization_code
// and refresh_token, PKCE S256.
//
// This is a public client: the app is distributed, so it cannot hold a secret.
// PKCE is what replaces it, and no client_secret is sent anywhere.

var CLIENT_ID = 'YOUR-FACILETHINGS-CLIENT-ID';

var AUTHORIZE = 'https://api2.facilethings.com/oauth/authorize';
var TOKEN = 'https://api2.facilethings.com/oauth/token';
var SCOPE = 'user';

var STASH = 'ft_pkce';
var HTTP_OK = 200;

// Must match the redirect_uri registered on the client, exactly.
var REDIRECT_URI = location.origin + location.pathname;

var app = document.getElementById('app');

function b64url(bytes) {
  var s = btoa(String.fromCharCode.apply(null, new Uint8Array(bytes)));
  return s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function random_string() {
  return b64url(crypto.getRandomValues(new Uint8Array(32)));
}

function challenge(verifier) {
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)).then(b64url);
}

function form_body(params) {
  return Object.keys(params).map(function(name) {
    return encodeURIComponent(name) + '=' + encodeURIComponent(params[name]);
  }).join('&');
}

function query(name) {
  return new URLSearchParams(location.search).get(name);
}

function show_error(message, detail) {
  app.innerHTML = '<h1>Setup failed</h1>'
    + '<div class="msg err">' + message + (detail ? '<br><code>' + detail + '</code></div>' : '</div>')
    + '<button id="again">Start over</button>';

  document.getElementById('again').onclick = function() { location.replace(REDIRECT_URI); };
}

function finish(data) {
  location.replace('pebblejs://close#' + encodeURIComponent(JSON.stringify(data)));

  app.innerHTML = '<h1>Connected</h1>'
    + '<div class="msg info">You can close this page and return to the watch.</div>';
}

// -- step 1: send the user to FacileThings ----------------------------------

function start() {
  var verifier = random_string();
  var state = random_string();

  challenge(verifier).then(function(code_challenge) {
    sessionStorage.setItem(STASH, JSON.stringify({ verifier: verifier, state: state }));

    location.assign(AUTHORIZE + '?' + form_body({
      response_type: 'code',
      client_id: CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      scope: SCOPE,
      state: state,
      code_challenge: code_challenge,
      code_challenge_method: 'S256'
    }));
  }).catch(function() {
    show_error('This browser cannot compute the PKCE challenge. The page must be served over HTTPS.');
  });
}

function show_start() {
  if (CLIENT_ID.indexOf('YOUR-') === 0) {
    return show_error('This page has no client id yet.',
                      'Set CLIENT_ID in docs/index.html to the id FacileThings issued.');
  }

  app.innerHTML = '<h1>FT Capture</h1>'
    + '<p>Connect the watchapp to your FacileThings account.</p>'
    + '<button id="go">Connect FacileThings</button>';

  document.getElementById('go').onclick = start;
}

// -- step 2: exchange the code ----------------------------------------------

function exchange(code, state) {
  var pending;
  try {
    pending = JSON.parse(sessionStorage.getItem(STASH));
  } catch (e) {
    pending = null;
  }

  if (!pending) return show_error('Setup was interrupted. Start again.');
  if (pending.state !== state) return show_error('State mismatch. Start again.');

  app.innerHTML = '<h1>Connecting…</h1>';

  // No client_secret: this is a public client and PKCE proves the exchange.
  fetch(TOKEN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: form_body({
      grant_type: 'authorization_code',
      code: code,
      redirect_uri: REDIRECT_URI,
      client_id: CLIENT_ID,
      code_verifier: pending.verifier
    })
  }).then(function(res) {
    return res.json().then(function(body) { return { status: res.status, body: body }; });
  }).then(function(res) {
    sessionStorage.removeItem(STASH);

    if (res.status !== HTTP_OK || !res.body.refresh_token) {
      return show_error('FacileThings rejected the sign in.',
                        res.body.error_description || res.body.error || res.status);
    }

    finish({
      client_id: CLIENT_ID,
      refresh_token: res.body.refresh_token,
      access_token: res.body.access_token,
      expires_at: Date.now() + (res.body.expires_in || 0) * 1000
    });
  }).catch(function() {
    sessionStorage.removeItem(STASH);
    show_error('Could not reach FacileThings.');
  });
}

// -- entry ------------------------------------------------------------------

var error = query('error');
var code = query('code');

if (error) {
  sessionStorage.removeItem(STASH);
  show_error('Authorization was refused.', query('error_description') || error);
} else if (code) {
  exchange(code, query('state'));
} else {
  show_start();
}
</script>
</body>
</html>
